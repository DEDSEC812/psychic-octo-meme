<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Message Board</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <h1>💬 Message Board</h1>
  <p class="subtitle">Tous les messages sont publics et enregistrés</p>

  <div class="form">
    <input type="text" id="name" placeholder="Ton nom">
    <textarea id="msg" placeholder="Écris ton message..."></textarea>
    <button id="sendBtn">Envoyer</button>
  </div>

  <div id="list"></div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, orderBy, query } 
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// 🔥 Firebase config
const firebaseConfig = {
  apiKey: "AIzaSyAm3PH3AaDQFwNUJ6zcbVcd_WyqjJ1mqYY",
  authDomain: "surius-tech.firebaseapp.com",
  projectId: "surius-tech",
  storageBucket: "surius-tech.firebasestorage.app",
  messagingSenderId: "948688898656",
  appId: "1:948688898656:web:8b3e77a1ea07a4164e5105"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ENVOI MESSAGE
document.getElementById("sendBtn").addEventListener("click", async () => {
  let name = document.getElementById("name").value;
  let msg = document.getElementById("msg").value;

  if(!name || !msg) return;

  await addDoc(collection(db, "messages"), {
    name,
    msg,
    time: Date.now()
  });

  document.getElementById("msg").value = "";
});

// AFFICHAGE LIVE
const q = query(collection(db, "messages"), orderBy("time","desc"));

onSnapshot(q, (snapshot) => {
  let list = document.getElementById("list");
  list.innerHTML = "";

  snapshot.forEach(doc => {
    let d = doc.data();

    let div = document.createElement("div");
    div.className = "msg";

    div.innerHTML = `
      <div class="top">
        <span class="name">${d.name}</span>
        <span class="time">• public</span>
      </div>
      <div class="text">${d.msg}</div>
    `;

    list.appendChild(div);
  });
});
</script>

</body>
</html>
